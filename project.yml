name: ConvertStation
options:
  bundleIdPrefix: com.jewhurst
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: YES
    CODE_SIGNING_ALLOWED: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: 6998422DKP
      CODE_SIGN_IDENTITY: "Developer ID Application: James Jewhurst (6998422DKP)"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      ENABLE_HARDENED_RUNTIME: YES
targets:
  ConvertStation:
    type: application
    platform: macOS
    sources:
      - path: ConvertStation
      - path: Resources
    dependencies:
      - package: Sparkle
      - sdk: QuickLook.framework
    info:
      path: ConvertStation/Info.plist
      properties:
        CFBundleName: ConvertStation
        CFBundleDisplayName: ConvertStation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Jewhurst Engineering"
        LSApplicationCategoryType: public.app-category.utilities
        SUEnableAutomaticChecks: true
        SUFeedURL: https://github.com/JewhurstEngineering/convertstation/releases/latest/download/appcast.xml
        SUPublicEDKey: 21krliPgcSC3TW0yVCj7jKGGfwWV7Om3OD76vn7+VXo=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jewhurst.ConvertStation
        PRODUCT_NAME: ConvertStation
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ConvertStation/ConvertStation.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          CODE_SIGN_ENTITLEMENTS: ConvertStation/ConvertStation-Release.entitlements
    postBuildScripts:
      - name: Bundle FFmpeg
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/scripts/bundle-ffmpeg.py" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
  ConvertStationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: ConvertStation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jewhurst.ConvertStationTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ConvertStation.app/Contents/MacOS/ConvertStation"
        BUNDLE_LOADER: "$(TEST_HOST)"
    postBuildScripts:
      - name: Resign sandboxed host
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/scripts/bundle-ffmpeg.py" "${BUILT_PRODUCTS_DIR}/ConvertStation.app"
schemes:
  ConvertStation:
    build:
      targets:
        ConvertStation: all
        ConvertStationTests: [test]
    test:
      config: Debug
      targets:
        - ConvertStationTests
    run:
      config: Debug
